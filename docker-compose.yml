# Docker stack cho VPS Ubuntu Linux (Postgres dùng Aiven managed)
#
# Quy trình triển khai:
#   1. cp .env.example .env                  -> sửa HTTP_PORT / VITE_API_URL nếu cần
#   2. cp backend/.env.example backend/.env  -> dán DATABASE_URL của Aiven + JWT_SECRET
#   3. docker compose up -d --build
#
# Chỉ frontend (nginx) mở ra ngoài internet ở HTTP_PORT (mặc định 80).
# Backend chạy nội bộ trong network "kinhlac_net", gọi thẳng ra Aiven Postgres qua SSL.

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: kinhlac/backend:latest
    container_name: kinhlac_backend
    restart: unless-stopped
    # Trần RAM để 1 service rò rỉ KHÔNG kéo sập cả VPS 2GB (kernel OOM giết đúng container quá hạn).
    # Backend thực tế chạy ~200-300MB; 768m dư cho heap 512 (--max-old-space-size) + overhead.
    mem_limit: 768m
    # Giới hạn log để KHÔNG phình đĩa (mặc định json-file là vô hạn).
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Tất cả biến runtime (DATABASE_URL của Aiven, JWT_SECRET, YESCALE_*, FRONTEND_URL …)
    # đều đến từ backend/.env. KHÔNG override DB_* ở đây vì đã trỏ ra ngoài Aiven.
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      APP_PORT: "3001"
      # Thư mục backend GHI ảnh AI (cover/body). Bind mount ./data/blog-images dùng CHUNG với nginx
      # (xem service frontend) → bấm "Vẽ ảnh bìa AI" / "Sinh ảnh minh hoạ" NGAY trên server là ra ảnh.
      BLOG_IMAGES_DIR: /app/blog-images
      # Thư mục backend GHI ảnh DƯỢC LIỆU do người dùng upload. Backend tự phục vụ tại /uploads;
      # nginx reverse-proxy /api/ → /api/uploads/... hiển thị được. Volume để ảnh BỀN qua các lần deploy.
      UPLOAD_DIR: /app/uploads
      # Pool Postgres nhỏ lại (DB Aiven ở ngoài, chỉ 1 instance backend) — đỡ giữ socket + RAM.
      DB_POOL_MAX: "5"
      # Không log THÂN request/response trong prod (tiết kiệm CPU/GC). Bật "true" khi cần debug.
      LOG_HTTP_BODIES: "false"
    volumes:
      - ./data/blog-images:/app/blog-images
      - ./data/vi-thuoc-uploads:/app/uploads
    networks:
      - kinhlac_net
    # Mặc định KHÔNG expose backend ra ngoài (đi qua nginx của frontend).
    # Bỏ comment nếu cần debug API trực tiếp từ máy admin qua SSH tunnel.
    # ports:
    #   - "127.0.0.1:3001:3001"

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    image: kinhlac/ml-service:latest
    container_name: kinhlac_ml
    restart: unless-stopped
    # Nạp model LƯỜI (xem app.py) nên khi rảnh chỉ ~120MB; khi soi lưỡi mới nạp TF (~700MB).
    # 896m dư cho lúc nạp model; nếu vượt, kernel chỉ restart RIÊNG service này, không sập VPS.
    mem_limit: 896m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      ML_SERVICE_PORT: "3002"
    networks:
      - kinhlac_net
    # Mặc định KHÔNG expose ra ngoài — backend gọi nội bộ qua http://ml-service:3002
    # ports:
    #   - "127.0.0.1:3002:3002"

  cms:
    build:
      context: ./cms
      dockerfile: Dockerfile
    image: kinhlac/cms:latest
    container_name: kinhlac_cms
    restart: unless-stopped
    # Astro + React SSR. Chưa đo mức thật trên VPS — 512m là mức đặt thận trọng, hãy
    # xem `docker stats` sau vài ngày rồi siết lại hoặc nới ra cho đúng.
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # DB_HOST/DB_USER/DB_PASSWORD/DB_NAME + EMDASH_ENCRYPTION_KEY. File này KHÔNG vào git.
    # Role cms_kinhlac chỉ sở hữu database kinhlac_cms, không đọc được dữ liệu bệnh nhân.
    env_file:
      - ./cms/.env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "4321"
      # ĐỊA CHỈ CÔNG KHAI — thiếu dòng này là KHÔNG đăng nhập được bằng passkey.
      #
      # Chuỗi thật là Caddy (cắt TLS) → nginx → cms, cả hai chặng sau đều là HTTP thuần.
      # @astrojs/node lấy scheme từ req.socket.encrypted và KHÔNG đọc X-Forwarded-Proto
      # (xem createRequestFromNodeRequest trong astro/dist/core/app/node.js), nên CMS tưởng
      # site là http://kinhlac.online — đo được bằng: curl -I https://kinhlac.online/_emdash/admin
      # → "location: http://kinhlac.online/_emdash/admin/login".
      #
      # Hệ quả: khi xác minh passkey, EmDash chờ origin "http://kinhlac.online" còn trình
      # duyệt gửi "https://kinhlac.online" → lệch → 401 "Authentication failed", không có
      # thông báo nào nói ra lý do. Magic link và link mời cũng sinh ra địa chỉ http://.
      #
      # EMDASH_SITE_URL là nấc ĐẦU trong getPublicOrigin(), đè lên suy đoán từ request.
      # Đặt Ở ĐÂY chứ KHÔNG đặt trong cms/.env: file .env được chép qua lại giữa máy dev và
      # VPS, mà trên máy dev origin phải là http://localhost:4321 — dính biến này là hỏng
      # passkey ở máy dev.
      #
      # Đổi tên miền thì phải sửa dòng này, nếu không passkey chết lặng y như cũ.
      EMDASH_SITE_URL: https://kinhlac.online
    volumes:
      # Ảnh người biên tập tải lên — phải BỀN qua mỗi lần deploy.
      - ./data/cms-uploads:/app/uploads
    networks:
      - kinhlac_net
    # Không mở ra ngoài: mọi truy cập đi qua nginx của frontend tại /_emdash/.

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Bake URL API vào bundle Vite lúc build.
        # Để mặc định "/api" -> nginx reverse-proxy sang backend (same-origin).
        VITE_API_URL: ${VITE_API_URL:-/api}
      # Biến DB cho ba bước prerender (dược liệu / cổ phương / nhóm dược lý) chạy lúc build.
      # Là SECRET chứ không phải arg: arg bị ghi vào lịch sử image cùng mật khẩu Aiven.
      # Thiếu file này thì build vẫn chạy, chỉ bỏ qua ba bước đó (xem frontend/Dockerfile).
      secrets:
        - db_env
    image: kinhlac/frontend:latest
    container_name: kinhlac_frontend
    restart: unless-stopped
    # nginx tĩnh — RAM rất thấp (~20-40MB). 128m là dư.
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "${HTTP_PORT:-8080}:80"
    depends_on:
      - backend
      - cms   # nginx resolve tên upstream lúc khởi động; thiếu cms là nginx không lên được
    volumes:
      # Phục vụ ẢNH AI từ CÙNG thư mục backend ghi (đường dẫn web /blog-images/<slug>/...).
      - ./data/blog-images:/usr/share/nginx/html/blog-images
    networks:
      - kinhlac_net

networks:
  kinhlac_net:
    driver: bridge

secrets:
  # Dùng lại chính file env của backend — nơi đã có DB_HOST/DB_PORT/DB_USER/DB_PASSWORD/DB_NAME.
  # Dockerfile chỉ lọc ra các dòng DB_* nên CA_CERTIFICATE và FIREBASE_SERVICE_ACCOUNT
  # (giá trị trải nhiều dòng) không lọt vào bước build.
  db_env:
    file: ./backend/.env
