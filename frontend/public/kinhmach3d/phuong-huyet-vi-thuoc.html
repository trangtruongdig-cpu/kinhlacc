<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Phương huyệt · Vị thuốc · Công năng</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "Times New Roman", Times, "Liberation Serif", serif;
    color: #1f2937; font-size: 11px; line-height: 1.4;
    -webkit-print-color-adjust: exact; print-color-adjust: exact;
  }

  /* Khung engine 3D — chạy NGẦM ngoài màn hình chỉ để chụp ảnh thân người. Không in ra. */
  #engine-host {
    position: fixed; left: -20000px; top: 0;
    width: 760px; height: 1120px; overflow: hidden;
    pointer-events: none; opacity: 0;
  }
  #engine-host .map-body { display: flex; width: 100%; height: 100%; }
  #engine-host .map-stage { position: relative; flex: 1; width: 100%; height: 100%; }
  #engine-host .map-toolbar,
  #engine-host .map-drawer,
  #engine-host .hf-inset,
  #engine-host .map-credit { display: none !important; }
  @media print { #engine-host { display: none !important; } }

  /* ── Phiếu in ── */
  #print-root { padding: 16px 20px; }
  .loading { padding: 60px 20px; text-align: center; color: #6b7280; font-size: 13px; }
  .loading .spin {
    width: 26px; height: 26px; margin: 0 auto 14px; border-radius: 50%;
    border: 3px solid #e5e7eb; border-top-color: #b45309; animation: sp 0.8s linear infinite;
  }
  @keyframes sp { to { transform: rotate(360deg); } }

  h1 { font-size: 17px; margin: 0 0 2px; }
  .subtitle { font-size: 11px; color: #6b7280; margin-bottom: 12px; }

  .acp-diagrams { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
  .acp-diagram { text-align: center; }
  .acp-svg { width: 340px; height: auto; border: 1px solid #e5e7eb; border-radius: 6px; background: #fff; }
  .acp-cap { font-weight: 700; font-size: 11px; margin-top: 4px; }
  .acp-empty { width: 340px; padding: 40px 10px; text-align: center; color: #9ca3af; border: 1px dashed #d1d5db; border-radius: 6px; }
  .acp-label { font-size: 27px; fill: #1f2937; font-family: Arial, Helvetica, sans-serif; }
  .acp-label-name { font-weight: 700; }
  .acp-missing { margin-top: 8px; font-size: 10.5px; color: #b45309; }

  /* Chú giải & bảng các nhóm phương */
  /* 2 cột như phiếu châm huyệt: 13 mục xếp 1 cột dọc thì tràn sang trang thứ hai gần trống. */
  .acp-legend { margin-top: 14px; column-count: 2; column-gap: 18px; }
  .sec { break-inside: avoid; margin-bottom: 9px; }
  /* Dải tiêu đề nhóm: tên nhóm bên trái, gợi nhớ cấu thành bên phải (Nhân–Truật–Linh–Thảo…) */
  .sec-h {
    font-weight: 700; font-size: 12px; padding: 5px 10px; border-radius: 4px;
    color: #fff; margin-bottom: 0; display: flex; align-items: baseline;
    justify-content: space-between; gap: 10px; letter-spacing: 0.02em;
  }
  .sec-h .sec-sub { font-weight: 400; font-size: 10.5px; opacity: 0.92; white-space: nowrap; }
  table.tbl { width: 100%; border-collapse: collapse; font-size: 11px; }
  table.tbl td {
    border: 0; border-bottom: 1px solid #ece7dd; padding: 5px 8px;
    text-align: left; vertical-align: top;
  }
  table.tbl tr:last-child td { border-bottom: 0; }
  /* Nền kem rất nhạt cho cả khối, để dải màu tiêu đề đứng liền mạch với bảng */
  .sec table.tbl { background: #fdfbf7; }
  table.tbl td.stt { width: 22px; color: #9a8f7e; font-size: 10.5px; text-align: right; padding-right: 2px; }
  table.tbl td.huyet { white-space: nowrap; width: 42%; }
  table.tbl td.huyet .ten-huyet { font-weight: 700; font-size: 12px; }
  table.tbl td.huyet .ma { color: #8d8477; font-size: 10px; letter-spacing: 0.02em; }
  table.tbl td.eq { width: 14px; color: #b9b0a1; text-align: center; }
  table.tbl td.vithuoc { white-space: nowrap; }
  table.tbl td.vithuoc .ten-thuoc { font-weight: 700; font-size: 12px; }
  table.tbl td.vithuoc .han { font-size: 11px; color: #b23b2e; }
  table.tbl td.vithuoc .congnang { font-size: 10px; color: #6b6154; margin-top: 1px; white-space: normal; }

  .toolbar { text-align: center; margin: 4px 0 14px; }
  .toolbar button {
    font: inherit; font-size: 12px; padding: 6px 16px; cursor: pointer;
    border: 1px solid #b45309; background: #b45309; color: #fff; border-radius: 5px;
  }
  .toolbar button.ghost { background: #fff; color: #b45309; margin-left: 8px; }
  .foot { margin-top: 18px; font-size: 9.5px; color: #6b7280; text-align: center; }
  @media print {
    #print-root { padding: 8px 12px; }
    .toolbar { display: none; }
  }
</style>
</head>
<body>
  <!-- Phiếu in (nội dung được dựng sau khi engine 3D chụp xong ảnh thân người) -->
  <div id="print-root">
    <div class="loading">
      <div class="spin"></div>
      Đang tải đồ hình 3D và định vị huyệt… (lần đầu tải mô hình có thể mất vài giây)
    </div>
  </div>

  <!-- Khung engine 3D chạy ngầm ngoài màn hình. TRÙNG cấu trúc HOST_HTML trong acuMap3d.ts. -->
  <div id="engine-host">
    <div id="acu3dRoot" class="acu3d">
      <div class="map-toolbar">
        <button id="mapReset" class="mv-btn active">↻</button>
        <button id="mapFlow" class="mv-btn">✦</button>
        <button id="mapMirror" class="mv-btn active">⇋</button>
        <button id="mapInsetBtn" class="mv-btn">✋</button>
        <button id="mapEdit" class="mv-btn">✎</button>
        <div class="map-layers" id="mapLayers"></div>
        <div class="map-search">
          <input id="mapSearch" type="search" autocomplete="off" />
          <span id="mapCount" class="count dark"></span>
        </div>
      </div>
      <div class="map-body">
        <div class="map-stage" id="mapStage">
          <div class="map-credit"><span class="map-credit-text"></span></div>
          <div class="hf-inset" id="hfInset"></div>
        </div>
        <aside class="map-drawer" id="mapDrawer">
          <div class="map-legend" id="mapLegend"></div>
          <div class="drawer-body" id="drawerBody"></div>
        </aside>
      </div>
    </div>
  </div>

  <!-- Đặt các biến toàn cục TRƯỚC khi map3d.js chạy (giống ensureBooted trong acuMap3d.ts). -->
  <script>
    // File này nằm cùng thư mục /kinhmach3d/ với engine + data + models → base path là './'.
    window.ACU_MAP_BASE = './';
    window.ACU_ASSET_VER = '';
    window.ACU_API_BASE = ''; // không dùng tính năng Chấm Tay ở phiếu in
    // Bật render-on-demand của engine (animate chỉ vẽ khi 2 cờ này đúng).
    document.body.dataset.view = 'meridian';
    document.body.dataset.msub = 'map';
  </script>

  <!-- THỨ TỰ nạp = thứ tự thực thi (script ngoài, không async, chạy theo thứ tự trong DOM). -->
  <!-- 1) Three.js + bộ mở rộng -->
  <script src="vendor/three.min.js"></script>
  <script src="vendor/OrbitControls.js"></script>
  <script src="vendor/GLTFLoader.js"></script>
  <script src="vendor/meshopt_decoder.js"></script>
  <!-- 2) Dữ liệu thuần (gán window.ACUPOINTS / ACU_INDEX / ACU_COORDS3D / MERIDIANS …) -->
  <script src="data/acupoints.js"></script>
  <script src="data/acu-index.js"></script>
  <script src="data/acu-coords3d.js"></script>
  <script src="data/meridians.js"></script>
  <script src="data/dict-facets.js"></script>
  <script src="data/spacing.js"></script>
  <script src="data/handfoot-bones.js"></script>
  <!-- 3) Engine (chạy IIFE, gán window.AcuMap) -->
  <script src="map3d.js"></script>
  <script src="hand-foot-inset.js"></script>

  <!-- 4) Dữ liệu phiếu + dựng ảnh + bảng + in -->
  <script>
  (function () {
    'use strict';

    // ─────────────────────────────────────────────────────────────────────────
    // DỮ LIỆU GÁN CỨNG — 2 mục "phương huyệt ⇄ vị thuốc ⇄ công năng".
    // code : mã dùng cho engine 3D (KHÔNG gạch nối, vd "LR13").
    // ma   : mã hiển thị trên phiếu (có gạch nối, vd "LR-13").
    // ─────────────────────────────────────────────────────────────────────────
    var SECTIONS = [
      {
        title: 'Tứ Quân Tử · Bổ khí',
        sub: 'Nhân–Truật–Linh–Thảo',
        color: '#8a5a1b', // nâu
        rows: [
          { stt: 1, code: 'LR13', ma: 'LR-13', ten: 'Chương môn',  vithuoc: 'Nhân sâm',  han: '人參', congnang: 'Đại bổ nguyên khí, an thần' },
          { stt: 2, code: 'ST36', ma: 'ST-36', ten: 'Túc tam lý',  vithuoc: 'Bạch truật', han: '白朮', congnang: 'Kiện Tỳ hòa Vị' },
          { stt: 3, code: 'PC6',  ma: 'PC-6',  ten: 'Nội quan',    vithuoc: 'Phục linh',  han: '茯苓', congnang: 'Ninh Tâm, trừ thấp' },
          { stt: 4, code: 'CV12', ma: 'CV-12', ten: 'Trung quản',  vithuoc: 'Cam thảo',   han: '甘草', congnang: 'Ích Vị khí, điều hòa' },
        ],
      },
      {
        title: 'Tứ Vật · Bổ huyết',
        sub: 'Quy–Địa–Thược–Khung',
        color: '#b0281a', // đỏ
        rows: [
          { stt: 5, code: 'SP6',  ma: 'SP-6',  ten: 'Tam âm giao', vithuoc: 'Đương quy',  han: '當歸', congnang: 'Dưỡng huyết hòa doanh' },
          { stt: 6, code: 'CV4',  ma: 'CV-4',  ten: 'Quan nguyên', vithuoc: 'Thục địa',   han: '熟地', congnang: 'Tư âm dưỡng huyết' },
          { stt: 7, code: 'LR3',  ma: 'LR-3',  ten: 'Thái xung',   vithuoc: 'Bạch thược', han: '白芍', congnang: 'Bình Can, chỉ thống' },
          { stt: 8, code: 'LI11', ma: 'LI-11', ten: 'Khúc trì',    vithuoc: 'Xuyên khung', han: '川芎', congnang: 'Hành khí hoạt huyết' },
        ],
      },
      {
        title: 'Hoàng kỳ & Nhục quế',
        sub: '→ Thập toàn đại bổ (10)',
        color: '#8a6d1b', // vàng nâu
        rows: [
          { stt: 9,  code: 'LI4',  ma: 'LI-4',  ten: 'Hợp cốc',           vithuoc: 'Hoàng kỳ', han: '黃芪', congnang: 'Cố biểu, bổ khí' },
          { stt: 10, code: 'GB34', ma: 'GB-34', ten: 'Dương lăng tuyền', vithuoc: 'Nhục quế', han: '肉桂', congnang: 'Ôn thông kinh lạc' },
        ],
      },
      {
        title: 'Nhóm khác',
        sub: 'Lý khí · thăng đề · sơ tiết',
        color: '#2f5d3a', // xanh lục
        rows: [
          { stt: 11, code: 'ST40', ma: 'ST-40', ten: 'Phong long', vithuoc: 'Trần bì',  han: '陳皮', congnang: 'Hóa đờm, lý khí' },
          { stt: 12, code: 'PC5',  ma: 'PC-5',  ten: 'Gian sử',    vithuoc: 'Thăng ma', han: '升麻', congnang: 'Thăng đề dương khí' },
          { stt: 13, code: 'SI7',  ma: 'SI-7',  ten: 'Chi chính',  vithuoc: 'Sài hồ',   han: '柴胡', congnang: 'Sơ tiết Thiếu dương' },
        ],
      },
    ];

    // Tra ngược: engine-code → { meta, color } để tô màu chấm & nhãn theo mục.
    var META = {};
    SECTIONS.forEach(function (s) {
      s.rows.forEach(function (r) { META[r.code] = { row: r, color: s.color }; });
    });
    var ALL_CODES = SECTIONS.reduce(function (a, s) { return a.concat(s.rows.map(function (r) { return r.code; })); }, []);

    function escHtml(v) {
      return String(v == null ? '' : v).replace(/[&<>"]/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
      });
    }

    // ─────────────────────────────────────────────────────────────────────────
    // Vẽ SVG 1 mặt (front/back): ảnh thân người + chấm huyệt + đường dẫn nhãn.
    // Port từ KinhMach3DView.vue (buildSideSvg / layoutLabelSlots), tô màu theo mục.
    // ─────────────────────────────────────────────────────────────────────────
    // LỀ + CỠ CHỮ TÍNH THEO HỆ TOẠ ĐỘ SVG, KHÔNG PHẢI PIXEL THẬT. viewBox rộng ACP_MARGIN*2 + 700 =
    // 1220 đơn vị nhưng khung in chỉ 340px → mọi kích thước bên trong bị THU NHỎ ~3,6 lần. Cỡ chữ 9
    // (bản đầu của phiếu này) hiện ra 2,5px — in ra không ai đọc nổi tên huyệt. Các hằng số dưới đây
    // là ĐƠN VỊ VIEWBOX đã nhân sẵn, đồng bộ với phiếu châm huyệt ở KinhMach3DView.vue.
    var ACP_MARGIN = 260;   // lề trái/phải quanh ảnh thân người, dành chỗ cho nhãn + nét dẫn chỉ
    var ACP_FONT = 27;      // cỡ chữ nhãn (≈7,5px thật sau khi thu về khung 340px)
    var ACP_LABEL_GAP = 42; // khoảng cách dọc tối thiểu giữa 2 nhãn (≈12px thật)
    var ACP_DOT_R = 9;      // bán kính chấm huyệt trên ảnh
    var ACP_LEAD_W = 2.4;   // độ dày nét dẫn chỉ từ nhãn tới chấm
    // SVG cắt cụt chữ tràn khỏi viewBox, KHÔNG xuống dòng và không báo gì: "ST36 Túc Tam Lý" từng in
    // ra thành "ST36 Túc Tam". Ước bề rộng theo số ký tự (Arial ≈ 0,62 cỡ chữ, lấy dư tay vì chữ Việt
    // có dấu và nửa sau nhãn in đậm) rồi ép nhãn nào vượt lề co vừa khít — thà hẹp còn hơn mất chữ.
    var ACP_LABEL_MAX = ACP_MARGIN - 44;
    function labelFit(text) {
      var est = text.length * 0.62 * ACP_FONT;
      return est > ACP_LABEL_MAX ? ' textLength="' + ACP_LABEL_MAX + '" lengthAdjust="spacingAndGlyphs"' : '';
    }

    function layoutLabelSlots(points, imgH, minGap) {
      var sorted = points.slice().sort(function (a, b) { return a.y - b.y; });
      var prevY = -Infinity;
      return sorted.map(function (p) {
        var desired = p.y * imgH;
        var y = Math.max(desired, prevY + minGap);
        prevY = y;
        var out = {}; for (var k in p) out[k] = p[k];
        out.labelY = Math.min(y, imgH - 10);
        return out;
      });
    }

    function buildSideSvg(side, imgDataUrl, allPoints, W, H) {
      if (!imgDataUrl) {
        return '<div class="acp-empty">Không chụp được ảnh ' + (side === 'front' ? 'mặt trước' : 'mặt sau') + '.</div>';
      }
      var M = ACP_MARGIN;
      var totalW = W + M * 2;
      var pts = allPoints.filter(function (p) { return p.side === side && p[side]; }).map(function (p) {
        var proj = p[side];
        var meta = META[p.code] || {};
        var row = meta.row || {};
        return {
          code: row.ma || p.code,
          name: row.ten || p.name || '',
          color: meta.color || p.color || '#8a6d3b',
          x: proj.x, y: proj.y,
        };
      });
      var left = layoutLabelSlots(pts.filter(function (p) { return p.x < 0.5; }), H, ACP_LABEL_GAP);
      var right = layoutLabelSlots(pts.filter(function (p) { return p.x >= 0.5; }), H, ACP_LABEL_GAP);

      var dots = pts.map(function (p) {
        return '<circle cx="' + (M + p.x * W).toFixed(1) + '" cy="' + (p.y * H).toFixed(1) + '" r="' + ACP_DOT_R + '" fill="' + p.color + '" stroke="#fff" stroke-width="2.6" />';
      }).join('');

      function leaderAndLabel(p, anchor, labelX) {
        var dotX = M + p.x * W, dotY = p.y * H;
        var textX = anchor === 'end' ? labelX - 14 : labelX + 14;
        return '<line x1="' + labelX.toFixed(1) + '" y1="' + p.labelY.toFixed(1) + '" x2="' + dotX.toFixed(1) + '" y2="' + dotY.toFixed(1) + '" stroke="' + p.color + '" stroke-width="' + ACP_LEAD_W + '" opacity="0.8" />'
          + '<circle cx="' + labelX.toFixed(1) + '" cy="' + p.labelY.toFixed(1) + '" r="5" fill="' + p.color + '" />'
          + '<text x="' + textX.toFixed(1) + '" y="' + p.labelY.toFixed(1) + '" text-anchor="' + anchor + '" dominant-baseline="middle" class="acp-label"' + labelFit(p.code + ' ' + p.name) + '>'
          + escHtml(p.code) + ' <tspan class="acp-label-name">' + escHtml(p.name) + '</tspan></text>';
      }
      var leftMarkup = left.map(function (p) { return leaderAndLabel(p, 'end', M - 24); }).join('');
      var rightMarkup = right.map(function (p) { return leaderAndLabel(p, 'start', M + W + 24); }).join('');

      return '<svg class="acp-svg" viewBox="0 0 ' + totalW + ' ' + H + '" xmlns="http://www.w3.org/2000/svg">'
        + '<image href="' + imgDataUrl + '" x="' + M + '" y="0" width="' + W + '" height="' + H + '" preserveAspectRatio="xMidYMid meet" />'
        + dots + leftMarkup + rightMarkup
        + '</svg>';
    }

    // Bảng 1 nhóm: số thứ tự · huyệt (tên + mã) · vị thuốc (tên + chữ Hán) · công năng.
    function sectionTableHtml(s) {
      var rows = s.rows.map(function (r) {
        return '<tr>'
          + '<td class="stt">' + r.stt + '</td>'
          + '<td class="huyet"><span class="ten-huyet">' + escHtml(r.ten) + '</span> <span class="ma">' + escHtml(r.ma) + '</span></td>'
          + '<td class="eq">=</td>'
          + '<td class="vithuoc">'
            + '<span class="ten-thuoc" style="color:' + s.color + '">' + escHtml(r.vithuoc) + '</span>'
            + ' <span class="han">' + escHtml(r.han || '') + '</span>'
            + '<div class="congnang">' + escHtml(r.congnang) + '</div>'
          + '</td>'
          + '</tr>';
      }).join('');
      return '<div class="sec">'
        + '<div class="sec-h" style="background:' + s.color + '">'
          + '<span class="sec-t">' + escHtml(s.title.toUpperCase()) + '</span>'
          + '<span class="sec-sub">' + escHtml(s.sub || '') + '</span>'
        + '</div>'
        + '<table class="tbl"><tbody>' + rows + '</tbody></table></div>';
    }

    function renderSheet(result) {
      var frontSvg = buildSideSvg('front', result.front, result.points, result.width, result.height);
      var backSvg = buildSideSvg('back', result.back, result.points, result.width, result.height);

      var missingHtml = '';
      if (result.missing && result.missing.length) {
        missingHtml = '<div class="acp-missing">⚠ Không xác định được vị trí trên đồ hình 3D: ' + result.missing.map(escHtml).join(', ') + '</div>';
      }
      var legendHtml = SECTIONS.map(sectionTableHtml).join('');
      var printedAt = new Date().toLocaleString('vi-VN');

      document.getElementById('print-root').innerHTML =
          '<h1>PHƯƠNG HUYỆT · VỊ THUỐC · CÔNG NĂNG</h1>'
        + '<div class="subtitle">Vị trí huyệt trên đồ hình cơ thể — kèm vị thuốc &amp; công năng tương ứng</div>'
        + '<div class="toolbar"><button onclick="window.print()">🖶 In phiếu</button>'
        + '<button class="ghost" onclick="location.reload()">↻ Dựng lại</button></div>'
        + '<div class="acp-diagrams">'
        + '<div class="acp-diagram">' + frontSvg + '<div class="acp-cap">Mặt trước</div></div>'
        + '<div class="acp-diagram">' + backSvg + '<div class="acp-cap">Mặt sau</div></div>'
        + '</div>'
        + missingHtml
        + '<div class="acp-legend">' + legendHtml + '</div>'
        + '<div class="foot">Phiếu in lúc ' + escHtml(printedAt) + ' · Vị trí huyệt trên đồ hình mang tính minh hoạ tương đối, tham khảo thêm hướng dẫn của thầy thuốc.</div>';

      // Tự mở hộp thoại in sau khi ảnh (data URL) đã sẵn trong DOM.
      setTimeout(function () { window.print(); }, 250);
    }

    function fail(msg) {
      document.getElementById('print-root').innerHTML =
        '<div class="loading" style="color:#b91c1c">✖ ' + escHtml(msg)
        + '<div style="margin-top:12px"><button onclick="location.reload()" style="font:inherit;padding:6px 16px;cursor:pointer">Thử lại</button></div></div>';
    }

    // ─────────────────────────────────────────────────────────────────────────
    // Chờ engine sẵn sàng (model tải xong + huyệt đã đặt) rồi chụp ảnh & dựng phiếu.
    // exportPrintDiagram tự xếp hàng tới khi pointsReady, nhưng vẫn chờ AcuMap tồn tại.
    // ─────────────────────────────────────────────────────────────────────────
    var waited = 0, MAX_WAIT = 45000, STEP = 200;
    function tryExport() {
      if (window.AcuMap && typeof window.AcuMap.exportPrintDiagram === 'function') {
        window.AcuMap.exportPrintDiagram(ALL_CODES, { width: 700, height: 1400 })
          .then(function (result) {
            if (!result || (!result.front && !result.back)) {
              fail('Không dựng được đồ hình (không chụp được ảnh thân người).');
              return;
            }
            renderSheet(result);
          })
          .catch(function (e) {
            fail('Lỗi khi dựng đồ hình: ' + (e && e.message ? e.message : String(e)));
          });
        return;
      }
      waited += STEP;
      if (waited >= MAX_WAIT) { fail('Engine 3D không khởi động được (quá thời gian chờ).'); return; }
      setTimeout(tryExport, STEP);
    }

    // Kích ResizeObserver của engine: #mapStage đã có kích thước cố định (CSS) nên initScene chạy ngay.
    // Chờ 1 nhịp để map3d.js gắn xong observer rồi bắt đầu poll.
    setTimeout(tryExport, 400);
  })();
  </script>
</body>
