# ── TRA LẠI IP CONTAINER, ĐỪNG GHIM LÚC KHỞI ĐỘNG ──────────────────────────────────
# `server backend:3001;` trần chỉ đổi tên ra IP MỘT LẦN lúc nginx khởi động. Deploy chỉ
# dựng lại backend/cms (không đụng frontend) thì container mới nhận IP mới, còn nginx vẫn
# bắn vào IP cũ → 502 ở mọi /api/ và /_emdash/ trong khi cả hai container báo "healthy".
# Đã xảy ra 30/09/2026 13:58 (deploy Rada SEO): log backend chỉ có lượt healthcheck,
# không một request nào từ nginx tới. `resolve` (nginx ≥ 1.27.3, image là 1.27-alpine)
# cho nginx tra lại DNS nội bộ của Docker (127.0.0.11) mỗi `valid` giây; nó cần `zone`.
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

upstream kinhlac_backend {
    zone kinhlac_backend 64k;
    server backend:3001 resolve;
    keepalive 32;
}

# CMS (EmDash/Astro) — tiến trình Node sống, render từ Postgres riêng của nó.
upstream kinhlac_cms {
    zone kinhlac_cms 64k;
    server cms:4321 resolve;
    keepalive 32;
}

# ── LỚP ĐỆM TRANG Ở NGINX ────────────────────────────────────────────────────────
# Tầng thứ hai, nằm TRƯỚC Node. EmDash đã có đệm trong tiến trình (1.288ms -> 1,9ms),
# nhưng đệm đó nằm trong bộ nhớ của chính tiến trình: `docker restart` là mất sạch, và
# lúc Node bận hay đang khởi động lại thì người đọc lãnh đủ.
#
# Lớp này giữ bản đã dựng trên ĐĨA của nginx, nên vẫn phục vụ được cả khi Node chết —
# đó là giá trị lớn nhất, hơn cả chuyện nhanh thêm.
#
# 300m đủ rộng: toàn bộ 15.054 trang tĩnh hiện tại mới 124MB.
proxy_cache_path /var/cache/nginx/cms levels=1:2 keys_zone=cms_trang:10m
                 max_size=300m inactive=24h use_temp_path=off;

# Người ĐANG ĐĂNG NHẬP CMS không được nhận bản đệm: họ phải thấy đúng thứ vừa sửa.
map $http_cookie $cms_co_phien {
    default            0;
    ~*(emdash|session) 1;
}
# Link xem trước bản nháp cũng không được đệm — nếu không, bản nháp rò ra cho người đọc.
map $arg__preview $cms_xem_truoc {
    default 0;
    ~.+     1;
}

# WebSocket/SSE dùng chung một header `Connection`, nhưng giá trị phải PHỤ THUỘC request:
#   - có Upgrade (websocket)  -> Connection: upgrade
#   - không có (HTTP thường, SSE) -> Connection rỗng, để nginx tự xử lý keepalive
# Trước đây đặt cứng `Connection "upgrade"` cho MỌI request qua /api/ → mọi request HTTP thường
# đều mang một header hop-by-hop vô nghĩa.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Chuyển hướng TƯƠNG ĐỐI (Location: /huyet/). nginx đứng sau Caddy nên thấy mình là
    # http — để mặc định thì nó ghi "Location: http://kinhlac.online/huyet/" cho mọi URL
    # thiếu dấu / cuối: hai bước nhảy (https → http → https) và một bước hạ xuống http.
    # Đo 30/09/2026 trên site thật. Kiểm: curl -sI https://kinhlac.online/huyet | grep -i location
    absolute_redirect off;

    # Cho phép upload file (ảnh khám, excel …) tới backend qua proxy
    client_max_body_size 50m;

    # ---- Security headers cơ bản ----
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---- Gzip ----
    gzip on;
    # Ưu tiên file .gz đã nén sẵn lúc build (xem Dockerfile) → KHÔNG nén lại mỗi request (đỡ CPU),
    # đặc biệt cho data 3D nặng: acupoints.js 2.7MB → ~447KB, benh.js 2.5MB → ~718KB.
    # Thiếu .gz thì tự nén live nhờ "gzip on" ở trên → luôn có nén.
    gzip_static on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml;

    # ---- Healthcheck cho Docker / load balancer ----
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok";
    }

    # ---- Luồng SSE realtime (tách riêng khỏi /api/ vì yêu cầu khác hẳn) ----
    # Kết nối này mở VÔ HẠN và nhỏ giọt từng dòng. Mọi thứ có tính "gom lại rồi gửi một thể"
    # đều phải tắt, không thì sự kiện nằm kẹt trong bộ đệm cho tới khi đầy.
    location = /api/notifications/sse {
        proxy_pass         http://kinhlac_backend/notifications/sse;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        proxy_buffering    off;   # không gom gói — đẩy thẳng từng sự kiện ra máy khách
        proxy_cache        off;
        gzip               off;   # nén sẽ cần đủ dữ liệu mới xả ra → giữ sự kiện lại
        add_header X-Accel-Buffering no always;   # chặn đệm ở tầng nginx lẫn CDN phía trước

        # Nhịp tim 20s (sse.controller.ts) giữ đường dây sống; 1h chỉ là hạn chót cuối cùng,
        # máy khách rớt thì tự nối lại (retry: 3000).
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---- Dò OAuth của MCP: trả 404 THẬT, đừng trả trang chủ ----
    # Máy khách MCP (claude.ai) thăm dò `/.well-known/oauth-*` trước khi kết nối. Ở đây
    # `try_files … /index.html` sẽ trả app shell kèm mã 200 — tức máy khách nhận HTML rồi
    # tưởng có OAuth. Đây đúng cái bẫy đã ghi trong CLAUDE.md ("đường sai không ra 404 mà
    # ra index.html, mã 200"), chỉ khác là lần này nạn nhân là máy chứ không phải người.
    # Cửa MCP xác thực bằng token trong đường dẫn, không dùng OAuth, nên 404 là câu trả lời
    # ĐÚNG — và là câu duy nhất máy khách hiểu được.
    location ^~ /.well-known/oauth- {
        return 404;
    }

    # ---- Reverse proxy: /api/* -> backend:3001/* ----
    # Trailing slash trong proxy_pass sẽ cắt prefix /api/
    # => frontend gọi /api/auth/login, backend nhận /auth/login.
    # ^~ để ƯU TIÊN hơn regex phục vụ ảnh tĩnh bên dưới → /api/uploads/x.webp vẫn proxy về backend.
    location ^~ /api/ {
        client_max_body_size 12m;   # cho phép upload ảnh dược liệu (backend giới hạn 8MB)
        proxy_pass         http://kinhlac_backend/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;

        proxy_connect_timeout 30s;
        # 600s: "Viết nháp" gọi AI 2 lần tuần tự (thân bài 3500 token + metadata), mỗi lần tới ~280s
        # (xem YESCALE_TIMEOUT_MS); ảnh gpt-image-2 ~90s. Để rộng kẻo cắt giữa chừng = 504.
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
        proxy_buffering       off;
    }

    # ---- Cache asset CÓ hash trong tên (output build của Vite) ----
    # Vite bake content-hash vào tên file trong /assets/ (vd index-a1b2c3.js).
    # Nội dung đổi => tên file đổi => cache "immutable" 1 năm hoàn toàn an toàn.
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---- Asset KHÔNG có hash trong tên ----
    # Engine kinh mạch 3D (/kinhmach3d/map3d.js, data/*.js), ảnh tĩnh, model .glb…
    # giữ NGUYÊN tên file qua mỗi lần deploy. KHÔNG được để "immutable":
    # nếu để, trình duyệt sẽ dùng bản cũ trong cả NĂM => bản cập nhật không "lên".
    # "no-cache" = vẫn lưu lại nhưng mỗi lần đều hỏi server (304 nếu chưa đổi => rất nhẹ),
    # đổi file là thấy ngay bản mới.
    location ~* \.(?:js|mjs|css|png|jpe?g|gif|ico|svg|webp|woff2?|ttf|eot|glb|gltf)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # (Khối /blog/ nằm phía dưới, sau khối /trang/. Ảnh/css/js dưới /blog/ có đuôi mở rộng
    # do location regex ở trên phục vụ tĩnh — kể cả /blog/blog.css mà MỌI trang tĩnh nạp.)
    # ---- Ảnh của CMS: ĐỆM LÂU ----
    # Phải đứng RIÊNG, TRƯỚC khối /_emdash/ bên dưới. Lý do: khối đó đặt `proxy_cache off`
    # có chủ ý (khu quản trị mang dữ liệu riêng từng phiên), nhưng ẢNH cũng nằm dưới cùng
    # tiền tố ấy. Không tách ra thì MỖI lượt xem trang từ điển đấm thẳng vào container CMS
    # cho từng tấm ảnh, không đệm — và CMS chết là cả thư viện mất ảnh.
    #
    # nginx chọn khối ^~ có TIỀN TỐ DÀI NHẤT, nên khối này thắng /_emdash/ bất kể thứ tự.
    # Đặt trước chỉ để người đọc thấy ngay.
    #
    # Đệm vĩnh viễn an toàn vì tên tệp là storageKey (ULID) — ảnh đổi thì khoá đổi, y như
    # vân tay nội dung của /_astro/. proxy_cache_use_stale giữ ảnh sống qua lúc CMS sập.
    location ^~ /_emdash/api/media/file/ {
        # EmDash trả `cache-control: public, max-age=0, must-revalidate` cho ảnh, nginx tôn
        # trọng nên KHÔNG đệm gì — đo được: gọi 3 lần đều MISS. Phải bỏ qua header đó.
        # An toàn vì URL là content-addressed: ảnh đổi thì storageKey đổi thì URL đổi.
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        # Một tấm ảnh ĐÃ ĐỆM mà mang Set-Cookie là phát phiên đăng nhập của người này cho
        # người khác. Ảnh không cần cookie, cắt thẳng.
        proxy_hide_header  Set-Cookie;
        proxy_cache        cms_trang;
        proxy_cache_valid  200 365d;
        proxy_cache_valid  404 1m;
        proxy_cache_lock   on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header X-Nginx-Cache $upstream_cache_status always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;

        proxy_pass         http://kinhlac_cms;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }

    # ---- CMS: khu quản trị, API và ảnh của EmDash ----
    # ^~ nên thắng cả khối regex đuôi file ở trên → ảnh .png trong /_emdash/api/media/
    # đi đúng sang CMS thay vì bị tìm trong thư mục tĩnh rồi trả 404.
    location ^~ /_emdash/ {
        # TUYỆT ĐỐI không đệm khu quản trị: người biên tập phải thấy đúng thứ vừa gõ, và
        # phản hồi ở đây mang dữ liệu riêng của từng phiên đăng nhập. Mặc định của nginx đã
        # là không đệm, khai rõ để người đọc sau biết đây là chủ ý chứ không phải sót.
        proxy_cache off;
        client_max_body_size 32m;   # người biên tập tải ảnh bài viết
        proxy_pass         http://kinhlac_cms;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_connect_timeout 30s;
        proxy_read_timeout    120s;
        proxy_buffering       off;
    }

    # Asset của Astro. KHÔNG trùng /assets/ của Vite nên hai ứng dụng sống chung được.
    location ^~ /_astro/ {
        # Tên file có vân tay nội dung => nội dung đổi thì tên đổi => đệm vĩnh viễn an toàn.
        # ⚠️ proxy_cache_valid KHÔNG có proxy_cache là directive chết — nginx lặng lẽ bỏ qua.
        # Bản trước thiếu đúng dòng proxy_cache nên khối này chưa từng đệm gì.
        proxy_cache        cms_trang;
        proxy_cache_valid  200 365d;
        proxy_cache_lock   on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header X-Nginx-Cache $upstream_cache_status always;

        proxy_pass         http://kinhlac_cms;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # ---- Trang công khai do CMS dựng ----
    # /blog/ KHÔNG đi qua khối này: nó có khối riêng bên dưới (tĩnh trước, CMS đỡ sau) và
    # cố ý KHÔNG đệm — đừng chép bộ proxy_cache dưới đây sang đó.
    #
    # Astro trả `cache-control: no-cache` để tự giữ quyền xoá đệm theo tag, nên nginx PHẢI
    # bỏ qua header đó mới đệm được — nhưng chỉ ở những đường công khai, tuyệt đối không ở
    # khu quản trị.
    location ^~ /trang/ {
        proxy_cache          cms_trang;
        proxy_cache_key      "$scheme$host$uri";
        proxy_cache_valid    200 301 302 60s;
        proxy_cache_valid    404 10s;
        # Node chết hay đang khởi động lại -> vẫn trả bản cũ thay vì lỗi 502.
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock     on;
        proxy_cache_bypass   $cms_co_phien $cms_xem_truoc;
        proxy_no_cache       $cms_co_phien $cms_xem_truoc;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        add_header X-Nginx-Cache $upstream_cache_status always;

        proxy_pass         http://kinhlac_cms;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 15s;
        proxy_read_timeout    60s;
    }

    # ---- Blog: TĨNH TRƯỚC, CMS ĐỠ SAU, backend cũ đỡ chót (kế hoạch 3, 01/10/2026) ----
    #   /blog/<slug>/     → tệp tĩnh nếu có (11 bài cũ, y nguyên từng byte)
    #                     → không có thì CMS dựng trực tiếp (bài vừa Publish — hiện NGAY)
    #                     → CMS trả 404 thì backend cũ (bài chỉ có trong DB app), rồi 404 thật
    #   /blog/            → CMS dựng trực tiếp (danh sách luôn mới)
    #   /blog/sitemap.xml → CMS sinh động (không có tệp tĩnh nên rơi qua try_files)
    #
    # ⚠️ `location /blog/` phải là tiền tố THƯỜNG, KHÔNG BAO GIỜ thêm `^~`. `^~` tắt khâu dò
    # regex, tức /blog/blog.css thôi không do khối đuôi tệp ở trên phục vụ mà rơi vào
    # try_files ở đây — vẫn ra tệp nhưng mất `Cache-Control: no-cache`, và ảnh/css KHÔNG có
    # tệp thì bị đẩy sang CMS rồi backend thay vì 404 ngay. blog.css là tệp mà MỌI trang
    # tĩnh (~7.000 trang từ điển) đang nạp.
    #
    # ⚠️ KHÔNG proxy_cache ở cả ba khối blog. CMS đã có đệm theo tag trong tiến trình; thêm
    # lớp 60 giây ở đây là bài vừa Publish hiện chậm một phút (IndexNow chờ trang lên 200
    # mới báo) và bài vừa gỡ còn sống thêm một phút.
    #
    # Hệ quả đã chấp nhận: sửa một trong 11 bài cũ trong CMS CHƯA đổi trang công khai (bản
    # tĩnh thắng) cho tới khi build-blog đọc từ CMS.

    # /blog thiếu dấu / cuối. Tương đối nhờ `absolute_redirect off` ở trên.
    location = /blog {
        return 301 /blog/$is_args$args;
    }

    # Trang danh sách: CMS dựng trực tiếp. CMS sập/đang khởi động lại (502/503/504) hoặc lỡ
    # trả 404 → trả bản tĩnh dist/blog/index.html của lần build gần nhất (thiếu bài mới
    # nhưng còn hơn trang lỗi).
    location = /blog/ {
        proxy_pass         http://kinhlac_cms;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
        proxy_intercept_errors on;
        error_page 404 502 503 504 = @blog_danh_sach_tinh;
    }
    location @blog_danh_sach_tinh {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-cache" always;
        add_header X-Blog-Nguon "tinh-du-phong" always;
        try_files /blog/index.html =404;
    }

    # /blog/<slug> thiếu dấu / cuối → 301 thêm "/". Chỉ MỘT đoạn sau /blog/ và đoạn đó
    # không có dấu chấm, nên /blog/blog.css, /blog/sitemap.xml, /blog/assets/x.png không
    # dính. Không lặp được: đích luôn kết thúc bằng "/", mà mẫu cấm "/" trong đoạn cuối.
    # Regex location thắng tiền tố thường /blog/ bên dưới; còn khối đuôi tệp ở trên chỉ
    # khớp URL có đuôi nên hai khối regex không bao giờ cùng khớp một URL.
    location ~ ^/blog/[^/.]+$ {
        return 301 $uri/$is_args$args;
    }

    location /blog/ {
        try_files $uri $uri/ @blog_cms;
    }
    location @blog_cms {
        # KHÔNG trailing slash → giữ nguyên URI /blog/<slug>/ khi chuyển cho CMS.
        proxy_pass         http://kinhlac_cms;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        # Nối ngắn: CMS sập thì người đọc không phải chờ lâu mới được chuyển sang backend.
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
        # 404 của CMS (slug không có / chưa đăng) → hỏi backend cũ; backend trả 404 thật
        # kèm trang "không tìm thấy" của nó. 500 của CMS thì ĐỂ NGUYÊN: đó là lỗi thật, che
        # nó bằng 404 của backend là giấu bệnh.
        #
        # 502/503/504 = CMS sập hoặc đang khởi động lại (mỗi lần deploy `cms` là một khoảng
        # như vậy) → vẫn hỏi backend cũ (bài chỉ có trong DB app vẫn ra 200), nhưng nếu
        # backend KHÔNG có bài thì trả 503 + Retry-After chứ không 404: lúc đó không ai biết
        # bài có tồn tại hay không, mà 404 cho một bài đang sống là bảo bot gỡ nó khỏi chỉ mục.
        # Chuỗi error_page lồng nhau này sống nhờ `recursive_error_pages on` Ở KHỐI NÀY (đo
        # trên nginx thật 01/10/2026: bỏ dòng đó đi thì 404 của backend đi thẳng ra ngoài —
        # tức quay lại đúng lỗi cũ mà `nginx -t` vẫn xanh). Dòng ở khối dưới chỉ để phòng.
        proxy_intercept_errors on;
        recursive_error_pages on;
        error_page 404 = @blog_render;
        error_page 502 503 504 = @blog_render_cms_sap;
    }
    # Như @blog_render, chỉ dùng khi CMS không trả lời được: 200 của backend đi thẳng ra,
    # 404 (và backend cũng sập) → 503 tạm nghỉ.
    location @blog_render_cms_sap {
        proxy_pass         http://kinhlac_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout    60s;
        proxy_intercept_errors on;
        recursive_error_pages on;
        error_page 404 502 503 504 = @blog_tam_nghi;
    }
    location @blog_tam_nghi {
        # `types { }` để /blog/sitemap.xml không mang text/xml cho một thân HTML.
        types { }
        default_type text/html;
        charset utf-8;
        add_header Retry-After "30" always;
        add_header Cache-Control "no-store" always;
        add_header X-Blog-Nguon "cms-tam-nghi" always;
        return 503 '<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="robots" content="noindex"><meta http-equiv="refresh" content="30"><title>Đang tải lại — Kinh Lạc Trương Gia</title><p style="font-family:sans-serif;max-width:32em;margin:15vh auto;padding:0 16px;text-align:center">Trang blog đang khởi động lại, vui lòng thử lại sau ít giây. Trang sẽ tự tải lại sau 30 giây.</p></html>';
    }

    # ── ĐƯỜNG LÙI (về đúng như trước kế hoạch 3) ──────────────────────────────────────
    # 1. Xoá BỐN khối phía trên: `= /blog`, `= /blog/` (+ @blog_danh_sach_tinh),
    #    `~ ^/blog/[^/.]+$`, và `/blog/` (+ @blog_cms, @blog_render_cms_sap, @blog_tam_nghi).
    #    GIỮ khối @blog_render bên dưới.
    # 2. Bỏ dấu # ở khối cũ ngay dưới đây, rồi `nginx -t && nginx -s reload` (hoặc dựng lại
    #    image frontend). Bài chỉ có trong CMS sẽ 404 trở lại; 11 bài tĩnh không đổi gì.
    #
    # # ⚠️ /blog/ VẪN do hệ cũ phục vụ (tĩnh trước, backend render sau). CHƯA chuyển sang CMS:
    # # 12 bài đang nằm trong Google, chỉ chuyển khi đã di cư xong và dựng xong theme.
    # location /blog/ {
    #     try_files $uri $uri/ @blog_render;
    # }

    location @blog_render {
        # KHÔNG trailing slash → giữ nguyên URI /blog/<slug>/ khi chuyển cho backend.
        proxy_pass         http://kinhlac_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout    60s;
    }

    # ---- SPA fallback ----
    # index.html KHÔNG có hash trong tên → PHẢI "no-cache" (luôn hỏi lại server) để sau mỗi
    # deploy, trình duyệt lấy NGAY shell mới (trỏ tới /assets/ hash mới) — tránh kẹt UI/CSS cũ.
    # Lưu ý: add_header trong location sẽ THAY (không kế thừa) add_header ở server → phải lặp lại
    # các security header ở đây kẻo bị mất trên trang HTML.
    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ @vo_spa;
    }

    # ---- Đường KHÔNG có tệp tĩnh → trả vỏ app, nhưng CẤM index ----
    # Trước 30/09/2026 mọi URL sai (vd /khong-ton-tai-xyz/, bài thuốc đã xoá) trả 200 + nội
    # dung trang chủ + robots "index" — soft 404, mỗi URL rác là một bản sao trang chủ trong
    # mắt Google. Không trả 404 cứng được vì app cần đường này: route /app/*, cổng bệnh nhân,
    # và bài thuốc/dược liệu MỚI thêm sau lần build (chưa có tệp tĩnh, Vue vẫn dựng được).
    # Mọi trang công khai cần index đều ĐÃ có tệp tĩnh (prerender-seo + các builder) nên
    # không đi qua nhánh này.
    location @vo_spa {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex" always;
        try_files /index.html =404;
    }

    # ---- Trang từ điển ĐỘC LẬP (không mount Vue): URL sai là 404 THẬT ----
    # Nhóm này không có route Vue nào, nên trả vỏ app chỉ ra trang chủ sai chỗ.
    # Đặt SAU location đuôi tệp (.js/.png…) ở trên: regex location khớp theo thứ tự khai báo.
    location ~ ^/(huyet|kinh|benh-hoc|cham-cuu-tri-benh|nguon)/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex" always;
    }
}
